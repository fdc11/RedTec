<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedTec - Iniciar Sesión</title>
  <!-- Bootstrap 5 CSS desde CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Hoja de estilos personalizada -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center py-4">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">

        <!-- Logotipo y Encabezado -->
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle p-3 mb-2 shadow-sm">
            <i class="bi bi-cpu fs-1"></i>
          </div>
          <h1 class="h3 fw-bold text-dark mb-1">RedTec</h1>
          <p class="text-muted small">Gestión Comunitaria de Inventario y Préstamos Tecnológicos</p>
        </div>

        <!-- Tarjeta de Login -->
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body p-4">
            <h2 class="h5 fw-semibold mb-3">Iniciar Sesión</h2>

            <!-- Contenedor de Alertas Dinámicas -->
            <div id="alert-container"></div>

            <form id="form-login" novalidate>
              <div class="mb-3">
                <label for="input-email" class="form-label fw-medium small">Correo Electrónico</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0">
                    <i class="bi bi-envelope"></i>
                  </span>
                  <input
                    type="email"
                    class="form-control border-start-0"
                    id="input-email"
                    placeholder="ejemplo@redtec.org"
                    required
                    autocomplete="email"
                  >
                </div>
              </div>

              <div class="mb-4">
                <label for="input-password" class="form-label fw-medium small">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0">
                    <i class="bi bi-shield-lock"></i>
                  </span>
                  <input
                    type="password"
                    class="form-control border-start-0"
                    id="input-password"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                  >
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-medium shadow-sm" id="btn-submit">
                <i class="bi bi-box-arrow-in-right me-1"></i> Acceder a la Plataforma
              </button>
            </form>
          </div>
        </div>

        <!-- Panel de Acceso Rápido para Defensa Oral (Seeders) -->
        <div class="card border-0 bg-white shadow-sm">
          <div class="card-body p-3">
            <h3 class="h6 text-muted text-uppercase fw-bold small mb-2 d-flex align-items-center gap-1">
              <i class="bi bi-person-badge text-primary"></i> Cuentas de Demostración (Seeders)
            </h3>
            <p class="text-secondary small mb-2">Haz clic sobre un usuario para autocompletar sus credenciales de prueba:</p>

            <div class="d-flex flex-column gap-2" id="quick-login-container">
              <button
                type="button"
                class="btn btn-outline-primary btn-sm text-start btn-demo-user"
                data-email="admin@redtec.org"
                data-password="Admin123!"
              >
                <strong class="d-block">Administrador</strong>
                <small class="text-muted">admin@redtec.org • Gestión global de inventario</small>
              </button>

              <button
                type="button"
                class="btn btn-outline-success btn-sm text-start btn-demo-user"
                data-email="carlos@redtec.org"
                data-password="Usuario123!"
              >
                <strong class="d-block">Carlos Gómez (Usuario Regular Limpio)</strong>
                <small class="text-muted">carlos@redtec.org • Sin mora, cupo disponible (0 activos)</small>
              </button>

              <button
                type="button"
                class="btn btn-outline-danger btn-sm text-start btn-demo-user"
                data-email="lucia@redtec.org"
                data-password="Usuario123!"
              >
                <strong class="d-block">Lucía Silva (En Mora)</strong>
                <small class="text-muted">lucia@redtec.org • Préstamo vencido (Demo regla mora: 403)</small>
              </button>

              <button
                type="button"
                class="btn btn-outline-warning btn-sm text-start text-dark btn-demo-user"
                data-email="marcos@redtec.org"
                data-password="Usuario123!"
              >
                <strong class="d-block">Marcos Peña (Cupo Lleno)</strong>
                <small class="text-muted">marcos@redtec.org • 2 préstamos activos (Demo límite: 409)</small>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Script externo para estricto cumplimiento de CSP (sin código inline) -->
  <script src="/js/login.js"></script>
</body>
</html>
